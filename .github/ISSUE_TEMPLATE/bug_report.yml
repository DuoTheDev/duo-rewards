name: Bug report
description: Something is broken or not working as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: duo-rewards version
      description: From fxmanifest.lua or the release you downloaded
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: qb-core version, ox_inventory version, MySQL/MariaDB version, FXServer build
      placeholder: "qb-core 1.3.0, ox_inventory 2.44, MariaDB 11.4, artifact 12345"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Link Twitch account
        2. Go live with the keyword
        3. Wait for the poll
        4. ...
  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: Server console lines starting with `[duo-rewards]` and any F8 client / NUI errors. Set `Config.Debug = true` for more detail. **Remove any credentials or webhook URLs.**
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I am on the latest release
          required: true
        - label: I imported `sql/install.sql` and the resource starts after qb-core, oxmysql and ox_inventory
          required: true
        - label: I removed all credentials and webhook URLs from the logs above
          required: true
